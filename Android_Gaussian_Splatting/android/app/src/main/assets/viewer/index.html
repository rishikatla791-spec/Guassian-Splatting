<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>3D Gaussian Splat Viewer</title>
    <style>
        :root {
            --bg: #eef1f6;
            --bg-grad: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #e8ecf4 55%, #dfe5ef 100%);
            --surface: rgba(255, 255, 255, 0.80);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --text: #17202e;
            --muted: #5d6c85;
            --accent: #3b6cf6;
            --accent-ink: #ffffff;
            --accent-soft: rgba(59, 108, 246, 0.13);
            --border: rgba(18, 31, 54, 0.09);
            --shadow-sm: 0 1px 2px rgba(20, 33, 61, 0.08), 0 2px 6px rgba(20, 33, 61, 0.07);
            --shadow-md: 0 2px 4px rgba(20, 33, 61, 0.07), 0 10px 24px rgba(20, 33, 61, 0.13);
            --shadow-lg: 0 4px 10px rgba(20, 33, 61, 0.09), 0 22px 48px rgba(20, 33, 61, 0.18);
            --ok: #128a5b;
            --warn: #b4661a;
            --track: rgba(18, 31, 54, 0.10);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.theme-dark {
            --bg: #0d1118;
            --bg-grad: radial-gradient(120% 90% at 50% 0%, #1a2130 0%, #101724 55%, #0a0e15 100%);
            --surface: rgba(30, 38, 52, 0.74);
            --surface-strong: rgba(34, 43, 58, 0.92);
            --text: #edf2f9;
            --muted: #9db0cb;
            --accent: #6d97ff;
            --accent-ink: #0b1020;
            --accent-soft: rgba(109, 151, 255, 0.18);
            --border: rgba(255, 255, 255, 0.10);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
            --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.45), 0 12px 28px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 6px 14px rgba(0, 0, 0, 0.5), 0 24px 52px rgba(0, 0, 0, 0.55);
            --ok: #4fd39b;
            --warn: #ffb865;
            --track: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
            overscroll-behavior: none;
            transition: background-color .35s ease, color .35s ease;
        }

        #canvas-container { position: absolute; inset: 0; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }

        /* ---------- HUD ---------- */
        #hud {
            position: absolute;
            top: calc(var(--safe-top) + 64px);
            left: 14px; right: 14px;
            z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        }

        .chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
            padding: 8px 13px;
            max-width: 100%;
            transition: background-color .35s ease, border-color .35s ease, opacity .25s ease, transform .25s ease;
        }

        #chip-name { font-size: 14px; font-weight: 650; letter-spacing: .1px; }
        #chip-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
        #model-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #chip-stats { font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; gap: 10px; padding: 6px 12px; }
        #chip-stats .sep { width: 1px; height: 11px; background: var(--border); }
        #chip-stats b { color: var(--text); font-weight: 700; }
        #chip-stats .lod { color: var(--warn); font-weight: 700; }
        #chip-stats.hide-lod .lod-wrap { display: none; }

        #chip-hint {
            font-size: 12px; font-weight: 600; color: var(--text);
            background: var(--surface-strong);
            box-shadow: var(--shadow-md);
            opacity: 0; transform: translateY(-6px); pointer-events: none;
        }
        #chip-hint.show { opacity: 1; transform: translateY(0); }

        /* ---------- Toolbar ---------- */
        #toolbar-wrap {
            position: absolute; left: 0; right: 0;
            bottom: calc(var(--safe-bottom) + 16px);
            z-index: 12;
            overflow-x: auto; overflow-y: hidden;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 6px 0 8px;
        }
        #toolbar-wrap::-webkit-scrollbar { display: none; }

        #toolbar {
            display: inline-flex; gap: 8px;
            padding: 0 14px;
            min-width: 100%;
            justify-content: center;
        }

        .btn {
            flex: none;
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 12.5px; font-weight: 650;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
            transition: transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease, background-color .25s ease, color .25s ease, opacity .2s ease;
            will-change: transform;
        }
        .btn .ic { font-size: 14px; line-height: 1; }
        .btn:active { transform: scale(.94); box-shadow: var(--shadow-sm); }
        .btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
        .btn.on .ic { filter: none; }
        .btn[disabled] { opacity: .45; pointer-events: none; }
        .btn.hidden { display: none; }

        /* ---------- Loading ---------- */
        #loading {
            position: absolute; inset: 0; z-index: 30;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg);
            transition: opacity .4s ease;
        }
        #loading.gone { opacity: 0; pointer-events: none; }
        #loading-card {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            padding: 26px 30px;
            min-width: 220px;
        }
        .ring { width: 56px; height: 56px; transform: rotate(-90deg); }
        .ring .track { fill: none; stroke: var(--track); stroke-width: 5; }
        .ring .bar {
            fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
            stroke-dasharray: 150.8; stroke-dashoffset: 150.8;
            transition: stroke-dashoffset .18s linear;
        }
        .ring.indeterminate { animation: spin 1.1s linear infinite; }
        .ring.indeterminate .bar { stroke-dasharray: 40 120; transition: none; stroke-dashoffset: 0; }
        @keyframes spin { to { transform: rotate(270deg); } }
        #loading-text { font-size: 13.5px; font-weight: 650; color: var(--text); text-align: center; }
        #loading-sub { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
        #loading-sub:empty { display: none; }

        /* ---------- Measurement overlay ---------- */
        #measure-svg { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
        #measure-svg.show { opacity: 1; }
        #measure-line { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 6; }
        #measure-line-halo { stroke: var(--surface-strong); stroke-width: 6; stroke-linecap: round; }
        .m-dot-outer { fill: var(--surface-strong); }
        .m-dot-inner { fill: var(--accent); }

        #measure-label {
            position: absolute; z-index: 9; left: 0; top: 0;
            padding: 7px 12px; border-radius: 14px;
            background: var(--accent); color: var(--accent-ink);
            font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums;
            box-shadow: var(--shadow-md);
            pointer-events: none; opacity: 0;
            transition: opacity .2s ease;
            will-change: transform;
        }
        #measure-label.show { opacity: 1; }

        /* ---------- Toast ---------- */
        #toast {
            position: absolute; left: 50%; z-index: 25;
            bottom: calc(var(--safe-bottom) + 78px);
            padding: 9px 16px; border-radius: 16px;
            background: var(--surface-strong); border: 1px solid var(--border);
            color: var(--text); font-size: 12.5px; font-weight: 650;
            box-shadow: var(--shadow-md);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            max-width: calc(100vw - 40px); text-align: center;
            opacity: 0; transform: translate(-50%, 10px);
            transition: opacity .22s ease, transform .22s cubic-bezier(.2,.8,.3,1);
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        #fatal {
            position: absolute; inset: 0; z-index: 40; display: none;
            align-items: center; justify-content: center; padding: 28px;
            background: var(--bg);
        }
        #fatal.show { display: flex; }
        #fatal-inner {
            background: var(--surface-strong); border: 1px solid var(--border);
            border-radius: 22px; box-shadow: var(--shadow-lg); padding: 22px 24px;
            font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.5;
            max-width: 460px; word-break: break-word; white-space: pre-wrap;
            -webkit-user-select: text; user-select: text;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gl-canvas"></canvas>
    </div>

    <svg id="measure-svg" xmlns="http://www.w3.org/2000/svg">
        <line id="measure-line-halo" x1="0" y1="0" x2="0" y2="0" />
        <line id="measure-line" x1="0" y1="0" x2="0" y2="0" />
        <circle id="m0-outer" class="m-dot-outer" cx="-99" cy="-99" r="9" />
        <circle id="m0-inner" class="m-dot-inner" cx="-99" cy="-99" r="4.5" />
        <circle id="m1-outer" class="m-dot-outer" cx="-99" cy="-99" r="9" />
        <circle id="m1-inner" class="m-dot-inner" cx="-99" cy="-99" r="4.5" />
    </svg>
    <div id="measure-label"></div>

    <div id="hud">
        <div class="chip" id="chip-name">
            <span class="dot"></span>
            <span id="model-name">3D Gaussian Splat</span>
        </div>
        <div class="chip" id="chip-stats">
            <span><b id="stat-fps">--</b> fps</span>
            <span class="sep"></span>
            <span><b id="stat-shown">0</b> / <span id="stat-total">0</span> splats</span>
            <span class="lod-wrap"><span class="sep"></span><span class="lod" id="stat-lod">LOD</span></span>
        </div>
        <div class="chip" id="chip-hint"><span id="hint-text"></span></div>
    </div>

    <div id="loading">
        <div id="loading-card">
            <svg class="ring indeterminate" id="load-ring" viewBox="0 0 56 56">
                <circle class="track" cx="28" cy="28" r="24"></circle>
                <circle class="bar" id="load-bar" cx="28" cy="28" r="24"></circle>
            </svg>
            <div id="loading-text">Preparing viewer&hellip;</div>
            <div id="loading-sub"></div>
        </div>
    </div>

    <div id="toolbar-wrap">
        <div id="toolbar">
            <button class="btn" id="btn-reset"><span class="ic">&#8634;</span>Reset</button>
            <button class="btn" id="btn-measure"><span class="ic">&#128207;</span>Measure</button>
            <button class="btn" id="btn-crop"><span class="ic">&#9986;</span>Crop floor</button>
            <button class="btn" id="btn-clean"><span class="ic">&#129529;</span>Clean</button>
            <button class="btn" id="btn-save"><span class="ic">&#128190;</span>Save</button>
            <button class="btn hidden" id="btn-restore"><span class="ic">&#8635;</span>Restore</button>
            <button class="btn" id="btn-ar"><span class="ic">&#128083;</span>AR</button>
            <button class="btn" id="btn-toggle-bg"><span class="ic" id="theme-ic">&#9790;</span><span id="theme-label">Dark</span></button>
        </div>
    </div>

    <div id="fatal"><div id="fatal-inner"></div></div>

    <script src="viewer.js" defer></script>
</body>
</html>
