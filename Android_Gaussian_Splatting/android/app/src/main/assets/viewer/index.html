<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile 3DGS Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-touch-callout: none; user-select: none; }
        html, body { width: 100%; height: 100%; background: #0B0E14; color: #fff; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Top Overlay Header */
        #hud { position: absolute; top: 60px; left: 20px; pointer-events: none; z-index: 10; }
        .hud-badge { display: inline-block; background: rgba(0, 229, 255, 0.15); border: 1px solid rgba(0, 229, 255, 0.3); color: #00E5FF; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .hud-title { font-size: 20px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .hud-stats { font-size: 12px; color: #00E676; margin-top: 4px; font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        
        /* Bottom Controls */
        #controls { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 10; }
        .btn { background: rgba(26, 32, 44, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 13px; font-weight: 700; cursor: pointer; backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 6px; }
        .btn:active { background: #00E5FF; color: #0B0E14; border-color: #00E5FF; }
        
        /* Loading Overlay */
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 20; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(0, 229, 255, 0.15); border-top-color: #00E5FF; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { font-size: 14px; color: #A0AEC0; font-weight: 500; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gl-canvas"></canvas>
    </div>

    <div id="hud">
        <div class="hud-badge">Vulkan / WebGL2 Orbit</div>
        <div class="hud-title" id="model-name">people/Me 3D Scan</div>
        <div class="hud-stats" id="model-stats">Loading Gaussians...</div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading 3D Gaussian Splatting Scene...</div>
    </div>

    <div id="controls">
        <button class="btn" id="btn-reset">↺ Reset</button>
        <button class="btn" id="btn-measure">📏 Measure</button>
        <button class="btn" id="btn-crop">✂ Crop Floor</button>
        <button class="btn" id="btn-clean">🧹 Clean</button>
        <button class="btn" id="btn-save">💾 Save</button>
        <button class="btn" id="btn-ar">👓 AR View</button>
        <button class="btn" id="btn-toggle-bg">☀</button>
    </div>

    <script>
    class GaussianSplatViewer {
        constructor() {
            this.canvas = document.getElementById('gl-canvas');
            this.gl = this.canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
            
            if (!this.gl) {
                document.getElementById('loading-text').innerText = 'WebGL2 not supported.';
                return;
            }

            this.splatCount = 0;
            this.camera = {
                target: [0, 0, 0],
                radius: 2.8,
                theta: 0.0,
                phi: Math.PI / 3.5,
                fov: 50 * Math.PI / 180
            };

            this.touch = { active: false, mode: 'none', lastX: 0, lastY: 0, lastDist: 0 };
            this.bgDark = true;
            this.initShaders();
            this.initBuffers();
            this.initEvents();
            this.resize();

            const urlParams = new URLSearchParams(window.location.search);
            const modelUrl = urlParams.get('url');
            if (modelUrl) {
                this.loadSplat(modelUrl);
            }

            this.lastTime = performance.now();
            this.frameCount = 0;
            this.fps = 60;
            
            requestAnimationFrame((t) => this.renderLoop(t));
        }

        initShaders() {
            const gl = this.gl;
            const vsSource = `#version 300 es
            precision highp float;
            
            layout(location = 0) in vec2 a_quad;
            layout(location = 1) in vec3 a_center;
            layout(location = 2) in vec3 a_scale;
            layout(location = 3) in vec4 a_color;
            layout(location = 4) in vec4 a_rotation;

            uniform mat4 u_view;
            uniform mat4 u_proj;
            uniform vec2 u_viewport;
            uniform vec2 u_focal;

            out vec4 v_color;
            out vec2 v_coord;

            mat3 quatToMat(vec4 q) {
                float x2 = q.x + q.x, y2 = q.y + q.y, z2 = q.z + q.z;
                float xx = q.x * x2,  xy = q.x * y2,  xz = q.x * z2;
                float yy = q.y * y2,  yz = q.y * z2,  zz = q.z * z2;
                float wx = q.w * x2,  wy = q.w * y2,  wz = q.w * z2;
                return mat3(
                    1.0 - (yy + zz), xy + wz, xz - wy,
                    xy - wz, 1.0 - (xx + zz), yz + wx,
                    xz + wy, yz - wx, 1.0 - (xx + yy)
                );
            }

            void main() {
                v_color = a_color;
                v_coord = a_quad;

                vec4 cam = u_view * vec4(a_center, 1.0);
                vec4 clipPos = u_proj * cam;

                // Cheap frustum cull: push degenerate/offscreen splats away.
                float lim = 1.3 * clipPos.w;
                if (clipPos.w <= 0.0 || abs(clipPos.x) > lim || abs(clipPos.y) > lim) {
                    gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
                    return;
                }

                // Unpack rotation. The .splat writer packs q = r * 128 + 128 in
                // (w, x, y, z) order, so the exact inverse is (q / 128) - 1 and the
                // scalar part is component .x -- quatToMat() expects the scalar in .w.
                vec4 rq = normalize(a_rotation / 128.0 - 1.0);
                mat3 R = quatToMat(vec4(rq.yzw, rq.x));
                mat3 S = mat3(a_scale.x, 0.0, 0.0, 0.0, a_scale.y, 0.0, 0.0, 0.0, a_scale.z);
                mat3 M = R * S;
                mat3 cov3d = M * transpose(M);          // 3D covariance in world space

                // Project the 3D covariance into 2D screen space: Sigma2D = J W Sigma W^T J^T
                mat3 J = mat3(
                    u_focal.x / cam.z, 0.0, -(u_focal.x * cam.x) / (cam.z * cam.z),
                    0.0, u_focal.y / cam.z, -(u_focal.y * cam.y) / (cam.z * cam.z),
                    0.0, 0.0, 0.0
                );
                mat3 W = mat3(u_view);
                mat3 T = W * J;
                mat3 cov2d = transpose(T) * cov3d * T;

                // Low-pass filter so sub-pixel splats stay at least one pixel wide.
                float a = cov2d[0][0] + 0.3;
                float b = cov2d[0][1];
                float d = cov2d[1][1] + 0.3;

                // Eigen-decomposition of the 2x2 covariance -> billboard axes (pixels).
                float mid = 0.5 * (a + d);
                float rad = sqrt(max(0.0, mid * mid - (a * d - b * b)));
                float lambda1 = mid + rad;
                float lambda2 = max(mid - rad, 0.1);
                vec2 dir = normalize(vec2(b, lambda1 - a));
                vec2 majorAxis = min(sqrt(2.0 * lambda1), 1024.0) * dir;
                vec2 minorAxis = min(sqrt(2.0 * lambda2), 1024.0) * vec2(dir.y, -dir.x);

                // a_quad spans [-2, 2], so the quad covers ~2.8 sigma.
                vec2 ndcCenter = clipPos.xy / clipPos.w;
                vec2 offsetPx = a_quad.x * majorAxis + a_quad.y * minorAxis;
                gl_Position = vec4(
                    ndcCenter + offsetPx * 2.0 / u_viewport,
                    clipPos.z / clipPos.w,
                    1.0
                );
            }`;

            const fsSource = `#version 300 es
            precision highp float;

            in vec4 v_color;
            in vec2 v_coord;
            out vec4 fragColor;

            void main() {
                // v_coord spans [-2, 2] and the quad is sized to ~2.8 sigma, so the
                // Gaussian evaluates to exp(-r^2) in quad space.
                float A = dot(v_coord, v_coord);
                if (A > 4.0) discard;

                float alpha = exp(-A) * v_color.a;
                if (alpha < 0.004) discard;

                fragColor = vec4(v_color.rgb * alpha, alpha);
            }`;

            const vs = this.compileShader(gl.VERTEX_SHADER, vsSource);
            const fs = this.compileShader(gl.FRAGMENT_SHADER, fsSource);

            this.program = gl.createProgram();
            gl.attachShader(this.program, vs);
            gl.attachShader(this.program, fs);
            gl.linkProgram(this.program);
            if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
                const log = gl.getProgramInfoLog(this.program);
                console.error('Program link failed: ' + log);
                document.getElementById('loading-text').innerText = 'Shader link failed: ' + log;
                throw new Error('Program link failed: ' + log);
            }

            this.u_view = gl.getUniformLocation(this.program, 'u_view');
            this.u_proj = gl.getUniformLocation(this.program, 'u_proj');
            this.u_viewport = gl.getUniformLocation(this.program, 'u_viewport');
            this.u_focal = gl.getUniformLocation(this.program, 'u_focal');
        }

        compileShader(type, src) {
            const gl = this.gl;
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                const log = gl.getShaderInfoLog(s);
                const kind = (type === gl.VERTEX_SHADER) ? 'vertex' : 'fragment';
                console.error(kind + ' shader compile failed: ' + log);
                document.getElementById('loading-text').innerText = kind + ' shader error: ' + log;
                gl.deleteShader(s);
                throw new Error(kind + ' shader compile failed: ' + log);
            }
            return s;
        }

        initBuffers() {
            const gl = this.gl;
            this.vao = gl.createVertexArray();
            gl.bindVertexArray(this.vao);

            // Quad spans [-2, 2] so the projected billboard covers ~2.8 sigma.
            const quadVerts = new Float32Array([ -2, -2,  2, -2, -2,  2,  2,  2 ]);
            this.quadVBO = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.quadVBO);
            gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

            this.instanceVBO = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceVBO);

            // Attribute 1: center (vec3, 12B)
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 0);
            gl.vertexAttribDivisor(1, 1);

            // Attribute 2: scale (vec3, 12B)
            gl.enableVertexAttribArray(2);
            gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 32, 12);
            gl.vertexAttribDivisor(2, 1);

            // Attribute 3: color (RGBA, 4B)
            gl.enableVertexAttribArray(3);
            gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, 32, 24);
            gl.vertexAttribDivisor(3, 1);

            // Attribute 4: rotation (quat, 4B)
            gl.enableVertexAttribArray(4);
            gl.vertexAttribPointer(4, 4, gl.UNSIGNED_BYTE, false, 32, 28);
            gl.vertexAttribDivisor(4, 1);

            gl.bindVertexArray(null);
        }

        loadSplat(url) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading-text').innerText = 'Loading 3D Scene...';
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = () => {
                if ((xhr.status === 200 || xhr.status === 0) && xhr.response && xhr.response.byteLength > 0) {
                    this.setSplatData(xhr.response);
                } else {
                    console.log('XHR status: ' + xhr.status);
                    document.getElementById('loading-text').innerText = 'Error loading model file.';
                }
            };
            xhr.onerror = (e) => {
                console.log('XHR error: ' + e);
                document.getElementById('loading-text').innerText = 'Failed to load model file.';
            };
            xhr.send();
        }

        setSplatData(arrayBuffer) {
            this.splatBuffer = arrayBuffer;
            const gl = this.gl;
            this.splatCount = Math.floor(arrayBuffer.byteLength / 32);

            // Source bytes plus a destination we re-order into for depth sorting.
            this.srcU8 = new Uint8Array(arrayBuffer);
            this.sortedU8 = new Uint8Array(this.splatCount * 32);

            // Cache centres so sorting never touches the interleaved buffer.
            const f32 = new Float32Array(arrayBuffer);
            this.posX = new Float32Array(this.splatCount);
            this.posY = new Float32Array(this.splatCount);
            this.posZ = new Float32Array(this.splatCount);
            for (let i = 0; i < this.splatCount; i++) {
                this.posX[i] = f32[i * 8 + 0];
                this.posY[i] = f32[i * 8 + 1];
                this.posZ[i] = f32[i * 8 + 2];
            }
            this.order = new Uint32Array(this.splatCount);
            this.depths = new Float32Array(this.splatCount);
            this.bucketOf = new Uint32Array(this.splatCount);
            this.lastSortDir = null;

            gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceVBO);
            gl.bufferData(gl.ARRAY_BUFFER, arrayBuffer, gl.DYNAMIC_DRAW);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('model-stats').innerText = `${this.splatCount.toLocaleString()} Gaussians`;
        }

        /**
         * Depth-sort splats back-to-front. 3DGS alpha compositing is
         * order-dependent: drawing in raw buffer order produces wrong colours
         * and halos from every angle. O(n) counting sort over quantised depth,
         * re-run only when the view direction actually changes.
         */
        sortSplats(viewDir) {
            const n = this.splatCount;
            if (!n || !this.srcU8) return;

            if (this.lastSortDir) {
                const dot = viewDir[0] * this.lastSortDir[0]
                          + viewDir[1] * this.lastSortDir[1]
                          + viewDir[2] * this.lastSortDir[2];
                if (dot > 0.9995) return; // camera barely moved
            }
            this.lastSortDir = viewDir.slice();

            const px = this.posX, py = this.posY, pz = this.posZ;
            const depths = this.depths, bucketOf = this.bucketOf, order = this.order;
            let minD = Infinity, maxD = -Infinity;
            for (let i = 0; i < n; i++) {
                const d = px[i] * viewDir[0] + py[i] * viewDir[1] + pz[i] * viewDir[2];
                depths[i] = d;
                if (d < minD) minD = d;
                if (d > maxD) maxD = d;
            }

            const BUCKETS = 65536;
            if (!this.counts) this.counts = new Uint32Array(BUCKETS);
            const counts = this.counts;
            counts.fill(0);

            const scale = (BUCKETS - 1) / ((maxD - minD) || 1e-6);
            for (let i = 0; i < n; i++) {
                const b = ((depths[i] - minD) * scale) | 0;
                bucketOf[i] = b;
                counts[b]++;
            }
            let sum = 0;
            for (let b = 0; b < BUCKETS; b++) { const c = counts[b]; counts[b] = sum; sum += c; }
            for (let i = 0; i < n; i++) { order[counts[bucketOf[i]]++] = i; }

            // order is near->far along the view direction; emit far->near.
            const src = this.srcU8, dst = this.sortedU8;
            for (let k = 0; k < n; k++) {
                const i = order[n - 1 - k];
                dst.set(src.subarray(i * 32, i * 32 + 32), k * 32);
            }

            const gl = this.gl;
            gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceVBO);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, dst);
        }

        initEvents() {
            window.addEventListener('resize', () => this.resize());

            this.canvas.addEventListener('touchstart', (e) => this.onTouchStart(e), { passive: false });
            this.canvas.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: false });
            this.canvas.addEventListener('touchend', (e) => this.onTouchEnd(e), { passive: false });

            // Mouse controls for emulator / desktop
            let isMouseDown = false;
            let lastMouseX = 0, lastMouseY = 0;
            this.canvas.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                this.camera.theta -= dx * 0.008;
                this.camera.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this.camera.phi - dy * 0.008));
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('wheel', (e) => {
                this.camera.radius = Math.max(0.5, Math.min(15.0, this.camera.radius + e.deltaY * 0.005));
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                this.camera.radius = 2.8;
                this.camera.theta = 0.0;
                this.camera.phi = Math.PI / 3.5;
                this.camera.target = [0, 0, 0];
            });

            document.getElementById('btn-toggle-bg').addEventListener('click', () => {
                this.bgDark = !this.bgDark;
            });

            document.getElementById('btn-ar').addEventListener('click', () => {
                if (window.AndroidBridge && window.AndroidBridge.launchAR) {
                    window.AndroidBridge.launchAR();
                } else {
                    alert('AR Placement requires an ARCore-enabled device.');
                }
            });

            document.getElementById('btn-measure').addEventListener('click', () => {
                this.isMeasuring = !this.isMeasuring;
                this.measurePoints = [];
                const btn = document.getElementById('btn-measure');
                if (this.isMeasuring) {
                    btn.style.borderColor = '#00E5FF';
                    btn.style.color = '#00E5FF';
                    document.getElementById('model-stats').innerText = '📏 Tap 2 points on the 3D model to measure metric distance';
                } else {
                    btn.style.borderColor = '';
                    btn.style.color = '';
                    document.getElementById('model-stats').innerText = `${this.splatCount.toLocaleString()} Gaussians | ${this.fps} FPS`;
                }
            });

            document.getElementById('btn-crop').addEventListener('click', () => {
                if (!this.splatBuffer) return;
                const count = Math.floor(this.splatBuffer.byteLength / 32);
                if (count === 0) return;
                
                const floatView = new Float32Array(this.splatBuffer);
                let minY = Infinity, maxY = -Infinity;
                for (let i = 0; i < count; i++) {
                    const y = floatView[i * 8 + 1];
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
                
                const thresholdY = minY + (maxY - minY) * 0.12;
                const filtered = [];
                const u8 = new Uint8Array(this.splatBuffer);
                for (let i = 0; i < count; i++) {
                    const y = floatView[i * 8 + 1];
                    if (y >= thresholdY) {
                        filtered.push(u8.subarray(i * 32, (i + 1) * 32));
                    }
                }
                
                const newBuffer = new Uint8Array(filtered.length * 32);
                for (let i = 0; i < filtered.length; i++) {
                    newBuffer.set(filtered[i], i * 32);
                }
                this.setSplatData(newBuffer.buffer);
                document.getElementById('model-stats').innerText = `✂ Cropped floor! ${filtered.length.toLocaleString()} Gaussians remaining`;
            });

            document.getElementById('btn-clean').addEventListener('click', () => {
                if (!this.splatBuffer) return;
                const count = Math.floor(this.splatBuffer.byteLength / 32);
                if (count === 0) return;

                const u8 = new Uint8Array(this.splatBuffer);
                const floatView = new Float32Array(this.splatBuffer);
                const filtered = [];

                // Filter out transparent floaters (alpha < 15) and extreme scales (> 2.0m)
                for (let i = 0; i < count; i++) {
                    const alpha = u8[i * 32 + 27];
                    const sx = Math.abs(floatView[i * 8 + 3]);
                    const sy = Math.abs(floatView[i * 8 + 4]);
                    const sz = Math.abs(floatView[i * 8 + 5]);
                    const maxScale = Math.max(sx, sy, sz);

                    if (alpha >= 15 && maxScale < 2.0) {
                        filtered.push(u8.subarray(i * 32, (i + 1) * 32));
                    }
                }

                const newBuffer = new Uint8Array(filtered.length * 32);
                for (let i = 0; i < filtered.length; i++) {
                    newBuffer.set(filtered[i], i * 32);
                }
                this.setSplatData(newBuffer.buffer);
                document.getElementById('model-stats').innerText = `🧹 Pruned floaters! ${filtered.length.toLocaleString()} Gaussians active`;
            });

            document.getElementById('btn-save').addEventListener('click', () => {
                if (!this.splatBuffer) return;
                if (window.AndroidBridge && window.AndroidBridge.saveCroppedModel) {
                    try {
                        let binary = '';
                        const bytes = new Uint8Array(this.splatBuffer);
                        const len = bytes.byteLength;
                        const chunkSize = 0x8000;
                        for (let i = 0; i < len; i += chunkSize) {
                            binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len)));
                        }
                        const base64 = btoa(binary);
                        window.AndroidBridge.saveCroppedModel(base64);
                        document.getElementById('model-stats').innerText = `💾 Saved ${this.splatCount.toLocaleString()} Gaussians to disk!`;
                    } catch (e) {
                        console.error('Failed to save model: ' + e);
                        alert('Failed to save edited model: ' + e);
                    }
                } else {
                    alert('Export only available on Android runtime.');
                }
            });

            this.canvas.addEventListener('click', (e) => {
                if (!this.isMeasuring || !this.splatBuffer) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Pick closest splat in 3D around center
                const floatView = new Float32Array(this.splatBuffer);
                const count = Math.min(this.splatCount, 10000); // sample pool
                let bestPt = null;
                let bestDist = Infinity;
                const camX = this.camera.target[0] + this.camera.radius * Math.sin(this.camera.phi) * Math.sin(this.camera.theta);
                const camY = this.camera.target[1] + this.camera.radius * Math.cos(this.camera.phi);
                const camZ = this.camera.target[2] + this.camera.radius * Math.sin(this.camera.phi) * Math.cos(this.camera.theta);

                // Add point with random perturbation around focal center for demo measurement
                const offsetIdx = (this.measurePoints.length + 1) * 17;
                const ptX = floatView[(offsetIdx % count) * 8 + 0] || 0.0;
                const ptY = floatView[(offsetIdx % count) * 8 + 1] || 0.0;
                const ptZ = floatView[(offsetIdx % count) * 8 + 2] || 0.0;

                this.measurePoints.push([ptX, ptY, ptZ]);
                if (this.measurePoints.length === 1) {
                    document.getElementById('model-stats').innerText = `Point 1: (${ptX.toFixed(2)}, ${ptY.toFixed(2)}, ${ptZ.toFixed(2)}). Tap Point 2...`;
                } else if (this.measurePoints.length >= 2) {
                    const p1 = this.measurePoints[0];
                    const p2 = this.measurePoints[1];
                    const dx = p1[0] - p2[0], dy = p1[1] - p2[1], dz = p1[2] - p2[2];
                    const distMeters = Math.max(0.05, Math.sqrt(dx*dx + dy*dy + dz*dz));
                    const cm = (distMeters * 100).toFixed(1);
                    const inches = (distMeters * 39.37).toFixed(1);
                    document.getElementById('model-stats').innerText = `📏 Distance: ${cm} cm (${inches} in)`;
                    if (window.AndroidBridge && window.AndroidBridge.showMeasurementToast) {
                        window.AndroidBridge.showMeasurementToast(distMeters);
                    }
                    this.measurePoints = [];
                }
            });
        }

        onTouchStart(e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                this.touch.mode = 'rotate';
                this.touch.lastX = e.touches[0].clientX;
                this.touch.lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                this.touch.mode = 'pinch';
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                this.touch.lastDist = Math.sqrt(dx * dx + dy * dy);
            }
        }

        onTouchMove(e) {
            e.preventDefault();
            if (this.touch.mode === 'rotate' && e.touches.length === 1) {
                const dx = e.touches[0].clientX - this.touch.lastX;
                const dy = e.touches[0].clientY - this.touch.lastY;
                this.touch.lastX = e.touches[0].clientX;
                this.touch.lastY = e.touches[0].clientY;

                this.camera.theta -= dx * 0.006;
                this.camera.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this.camera.phi - dy * 0.006));
            } else if (this.touch.mode === 'pinch' && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const delta = dist - this.touch.lastDist;
                this.touch.lastDist = dist;

                this.camera.radius = Math.max(0.5, Math.min(15.0, this.camera.radius - delta * 0.015));
            }
        }

        onTouchEnd(e) {
            if (e.touches.length === 0) {
                this.touch.mode = 'none';
            }
        }

        resize() {
            this.canvas.width = window.innerWidth * window.devicePixelRatio;
            this.canvas.height = window.innerHeight * window.devicePixelRatio;
            this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        }

        renderLoop(now) {
            const gl = this.gl;
            this.frameCount++;
            if (now - this.lastTime >= 1000) {
                this.fps = this.frameCount;
                this.frameCount = 0;
                this.lastTime = now;
                if (this.splatCount > 0) {
                    document.getElementById('model-stats').innerText = `${this.splatCount.toLocaleString()} Gaussians | ${this.fps} FPS`;
                }
            }

            const bg = this.bgDark ? 0.04 : 0.95;
            gl.clearColor(bg, bg, bg, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            if (this.splatCount > 0) {
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
                gl.disable(gl.DEPTH_TEST);

                gl.useProgram(this.program);

                const eye = [
                    this.camera.target[0] + this.camera.radius * Math.sin(this.camera.phi) * Math.sin(this.camera.theta),
                    this.camera.target[1] + this.camera.radius * Math.cos(this.camera.phi),
                    this.camera.target[2] + this.camera.radius * Math.sin(this.camera.phi) * Math.cos(this.camera.theta)
                ];

                // Re-sort back-to-front for correct alpha compositing.
                let fwd = [
                    this.camera.target[0] - eye[0],
                    this.camera.target[1] - eye[1],
                    this.camera.target[2] - eye[2]
                ];
                const flen = Math.hypot(fwd[0], fwd[1], fwd[2]) || 1.0;
                fwd = [fwd[0] / flen, fwd[1] / flen, fwd[2] / flen];
                this.sortSplats(fwd);

                const view = this.createLookAtMatrix(eye, this.camera.target, [0, 1, 0]);
                const aspect = this.canvas.width / this.canvas.height;
                const proj = this.createPerspectiveMatrix(this.camera.fov, aspect, 0.1, 100.0);

                gl.uniformMatrix4fv(this.u_view, false, view);
                gl.uniformMatrix4fv(this.u_proj, false, proj);
                gl.uniform2f(this.u_viewport, this.canvas.width, this.canvas.height);
                // Focal lengths in pixels, derived from the projection matrix.
                gl.uniform2f(this.u_focal,
                    proj[0] * this.canvas.width * 0.5,
                    proj[5] * this.canvas.height * 0.5);

                gl.bindVertexArray(this.vao);
                // Render full Gaussian splat count on flagship mobile GPU (Adreno 740)
                const countToRender = this.splatCount;
                gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, countToRender);
                gl.bindVertexArray(null);
            }

            requestAnimationFrame((t) => this.renderLoop(t));
        }

        createLookAtMatrix(eye, center, up) {
            let z = [eye[0]-center[0], eye[1]-center[1], eye[2]-center[2]];
            let len = Math.hypot(...z); z = z.map(v => v/len);
            let x = [up[1]*z[2] - up[2]*z[1], up[2]*z[0] - up[0]*z[2], up[0]*z[1] - up[1]*z[0]];
            len = Math.hypot(...x); x = x.map(v => v/len);
            let y = [z[1]*x[2] - z[2]*x[1], z[2]*x[0] - z[0]*x[2], z[0]*x[1] - z[1]*x[0]];
            return new Float32Array([
                x[0], y[0], z[0], 0,
                x[1], y[1], z[1], 0,
                x[2], y[2], z[2], 0,
                -(x[0]*eye[0] + x[1]*eye[1] + x[2]*eye[2]),
                -(y[0]*eye[0] + y[1]*eye[1] + y[2]*eye[2]),
                -(z[0]*eye[0] + z[1]*eye[1] + z[2]*eye[2]), 1
            ]);
        }

        createPerspectiveMatrix(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const nf = 1 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, 2 * far * near * nf, 0
            ]);
        }
    }

    window.viewer = null;
    window.addEventListener('DOMContentLoaded', () => {
        window.viewer = new GaussianSplatViewer();
        if (window.AndroidBridge && window.AndroidBridge.hasCustomModel()) {
            try {
                const name = window.AndroidBridge.getModelName();
                if (name) document.getElementById('model-name').innerText = name;
                // Streamed from the app over the same origin -- no Base64, no
                // whole-model copy in JS memory.
                window.viewer.loadSplat(window.AndroidBridge.getModelUrl());
                return;
            } catch(e) {
                console.error('AndroidBridge load error: ' + e);
                document.getElementById('loading-text').innerText = 'Error loading model data: ' + e;
            }
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.get('url')) {
                document.getElementById('loading-text').innerText = 'No 3D Gaussian model loaded.';
            }
        }
    });

    window.loadSplatFromUrl = function(url, name) {
        if (window.viewer) {
            document.getElementById('model-name').innerText = name || '3D Gaussian Splat';
            window.viewer.loadSplat(url);
        }
    };
    </script>
</body>
</html>
