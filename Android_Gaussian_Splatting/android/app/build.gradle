plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials are read from android/keystore.properties, which is
// gitignored and never contains anything in the repo. Without it the release build
// still succeeds, signed with the debug key -- installable for testing but NOT
// publishable. `hasReleaseKeystore` below is what decides.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.getProperty("storeFile") != null &&
        rootProject.file(keystoreProps.getProperty("storeFile")).exists()

android {
    namespace 'com.splat.mobile3dgs'
    compileSdk 34

    defaultConfig {
        applicationId "com.splat.mobile3dgs"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // x86_64 is included so the app installs on the Android Emulator, whose
            // virtual-scene camera can drive ARCore. The prebuilt training engine
            // (libbrush_c.so) is arm64-only, so the emulator can exercise the whole
            // capture/pose/seeding path and export a dataset, then report the engine
            // as unavailable -- which is enough to test everything before training.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // R8 strips the unused half of Material/AndroidX and shrinks unused
            // resources. Everything reached only across the JNI or JavaScript
            // boundary is kept by name in proguard-rules.pro -- those names are
            // resolved as strings at runtime, so a rename fails at training time
            // rather than at build time.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            if (!hasReleaseKeystore) {
                logger.warn("WARNING: no android/keystore.properties -- signing the " +
                        "release build with the DEBUG key. Installable, not publishable.")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    // Pure-JVM tests exercise real app logic (splat/PLY serialisation, depth
    // unprojection, pose conventions). Android framework calls those paths do
    // not depend on -- android.util.Log in particular -- must no-op rather than
    // throw "Method ... not mocked".
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Google ARCore for real-time 6DoF Visual-Inertial Odometry
    implementation 'com.google.ar:core:1.41.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}
